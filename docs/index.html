<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>短线看盘</title>
    <script type="module" crossorigin src="/assets/index-CKaKqGky.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CzItAFx-.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 启动错误可视化：只显示本站脚本的错误，忽略浏览器扩展（MetaMask 等）注入的噪音
      (function () {
        function show(msg) {
          var d = document.createElement('pre');
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;margin:0;padding:16px;background:#111;color:#f66;font-size:13px;white-space:pre-wrap';
          d.textContent = '[启动错误] ' + msg;
          document.body.appendChild(d);
        }
        window.addEventListener('error', function (e) {
          var fn = e.filename || '';
          if (fn.indexOf('chrome-extension') === 0 || fn.indexOf('moz-extension') === 0) return;
          var msg = e.message || String(e);
          if (/MetaMask|metamask|web3|ethereum/i.test(msg)) return;
          show(msg + '\n' + fn + ':' + (e.lineno || ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          var txt = r && r.stack ? r.stack : String(r);
          if (/MetaMask|metamask|chrome-extension|web3|ethereum/i.test(txt)) return;
          show('rej: ' + (r && r.message ? r.message : String(r)));
        });
      })();
    </script>
  </body>
</html>
